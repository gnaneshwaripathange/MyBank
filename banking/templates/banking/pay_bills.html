

{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Pay Bills - MyBank</title>
    <link rel="stylesheet" href="{% static 'banking/style.css' %}">
</head>

<body class="auth-page">

    <div class="bill-container">

        <h1>MyBank</h1>
        <h2>Pay Your Bills</h2>
        <p class="subtitle">Quick and secure bill payments</p>

        <div class="balance-card">
            <p>Available Balance</p>
            <h2>₹{{ account.balance }}</h2>
        </div>

        {% if success %}
            <p class="success-message">{{ success }}</p>
        {% endif %}

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Select Bill Type</label>
            <select name="bill_type" required>
                <option value="">Select Bill</option>
                <option value="ELECTRICITY">Electricity</option>
                <option value="WATER">Water</option>
                <option value="INTERNET">Internet</option>
            </select>

            <label>Consumer Number</label>
            <input type="text" name="consumer_number"
                   placeholder="Enter consumer number" required>

            <label>Bill Amount (₹)</label>
            <input type="number" name="amount"
                   placeholder="Enter bill amount"
                   step="0.01" min="0.01" required>

            <button type="submit">Pay Bill</button>
        </form>

        <a href="{% url 'dashboard' %}">← Back to Dashboard</a>

    </div>

</body>
</html>
